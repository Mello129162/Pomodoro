<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Um site de gestão de tarefas baseado no método Pomodoro">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a>
            <img class="logo" src="imgs/tomato.png" alt="pomodoro logo">
        </a>
    </header>
    <main>
        <section class="pomodoro">
            <div class="card">
                <div  class="temporizador">
                    <h1 class="tempo" id="timer">25:00</h1>
                </div>
                <div  class="butoes">
                    <button id="iniciar">Iniciar</button>
                    <button id="pausar">Pausar</button>
                    <button id="reset">Reiniciar</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        
    </footer>
    <script src="script.js"></script>
</body>
</html>
